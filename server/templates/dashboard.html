<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>go-watchdog 모니터링 대시보드</title>
    <meta name="description" content="실시간 시스템 자원 모니터링 및 서버 관제 서비스 대시보드">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 분리된 공통 스타일시트 로드 -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- ADMIN_FLAG -->
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon"></div>
            <h1>go-watchdog System</h1>
        </div>
        <div class="system-status-indicator">
            <div class="pulse-dot"></div>
            <span>Dashboard Active</span>
        </div>
    </header>

    <!-- 탭 네비게이션 바 -->
    <nav class="tab-container">
        <button class="tab-btn active" data-tab="server-tab">서버 리소스 모니터링</button>
        <button class="tab-btn" data-tab="health-tab">서비스 API 헬스체크</button>
    </nav>

    <main>
        <!-- 탭 1: 서버 리소스 모니터링 컨텐츠 -->
        <div id="server-tab" class="tab-content active">
            <section class="grid-container" id="dashboard-grid">
                <!-- 에이전트 미연결 시 빈 화면 -->
                <div class="no-data" id="empty-state">
                    <div class="no-data-icon">🛰️</div>
                    <div class="no-data-text">에이전트 연결 대기 중</div>
                    <div class="no-data-hint">등록된 모니터링 서버가 없습니다. go-watchdog 에이전트를 가동하면 자동으로 수집이 시작됩니다.</div>
                </div>
            </section>
        </div>

        <!-- 탭 2: 서비스 API 헬스체크 컨텐츠 -->
        <div id="health-tab" class="tab-content">
            <div class="control-bar">
                <h2 style="font-size:1.1rem; font-weight:600; color:var(--text-secondary);">REST API 가용성 관제</h2>
                <button class="btn-primary" id="btn-open-register">➕ API 헬스체크 등록</button>
            </div>
            
            <section class="grid-container" id="health-grid">
                <!-- API 미등록 시 빈 화면 -->
                <div class="no-data" id="health-empty-state">
                    <div class="no-data-icon">🔗</div>
                    <div class="no-data-text">등록된 헬스체크 API가 없습니다.</div>
                    <div class="no-data-hint">우측 상단의 등록 버튼을 눌러 모니터링할 REST API 서비스들을 추가해 보세요.</div>
                </div>
            </section>
        </div>
    </main>

    <!-- API 등록 모달창 -->
    <div class="modal-overlay" id="register-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">API 헬스체크 등록</h3>
                <button class="modal-close" id="btn-close-register">×</button>
            </div>
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="api-name">서비스 명칭</label>
                    <input class="form-input" type="text" id="api-name" placeholder="예: Front App (Vite)" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="api-url">헬스체크 URL</label>
                    <input class="form-input" type="url" id="api-url" placeholder="예: http://localhost:5173/api/health" required>
                </div>
                <div class="form-group" style="flex-direction:row; gap:1rem; margin-bottom:0;">
                    <div class="form-group" style="flex:1;">
                        <label class="form-label" for="api-interval">체크 주기 (초)</label>
                        <input class="form-input" type="number" id="api-interval" value="60" min="5" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label class="form-label" for="api-timeout">제한 시간 (초)</label>
                        <input class="form-input" type="number" id="api-timeout" value="5" min="1" max="30" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" type="button" id="btn-cancel-register">취소</button>
                    <button class="btn-primary" type="submit">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 go-watchdog. Built with Go & SQLite. Real-time Infrastructure Monitoring.</p>
    </footer>

    <!-- 분리된 대시보드 스크립트 로드 -->
    <script src="/static/dashboard.js" defer></script>
    <!-- 신규 헬스체크 스크립트 로드 -->
    <script src="/static/health.js" defer></script>
</body>
</html>
